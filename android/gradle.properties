# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JVM settings: 2 GB 是 IDE sync 最低，4 GB 更舒服
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX（必须）
android.useAndroidX=true

# Kotlin 代码风格
kotlin.code.style=official

# 自动迁移到 AndroidX
android.enableJetifier=false

# KSP（Kotlin Symbol Processing，比 KAPT 快）
# ksp.useKSP2=true 已禁用——Hilt 2.52 + KSP 1.0.27 在 KSP2 模式下不稳定，
# 会抛 java.lang.IllegalArgumentException（详见 Dagger issue #4680）。
# 阶段 7 切 release 前评估：等 Hilt 升 2.56+ 或 KSP 2.1.x 之后再开。
ksp.useKSP2=false

# Compose 编译优化
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 性能：开启并行编译 + 缓存
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
