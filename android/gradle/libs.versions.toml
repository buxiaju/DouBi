[versions]
# Build tools
agp = "8.7.3"                          # Android Gradle Plugin
kotlin = "2.0.21"                      # Kotlin 编译器（K2）
ksp = "2.0.21-1.0.27"                  # KSP 须与 Kotlin 对齐

# AndroidX
core-ktx = "1.13.1"
# 阶段 9 v0.4.1：SplashScreen API（Android 12+ 圆形图标 + 背景色标准启屏）
core-splashscreen = "1.0.1"
# 阶段 9 v0.4.1：SplashScreen API（Android 12+ 圆形图标 + 背景色标准启屏）
core-splashscreen = "1.0.1"
appcompat = "1.7.0"
activity-compose = "1.9.3"
lifecycle = "2.8.7"

# Compose
compose-bom = "2024.10.01"
compose-compiler = "1.5.15"            # 配合 Kotlin 2.0

# Navigation
navigation-compose = "2.8.4"

# Hilt
hilt = "2.52"
hilt-navigation-compose = "1.2.0"
hilt-work = "1.2.0"

# Room
room = "2.7.2"                            # 2.7+ 起 MigrationTestHelper 稳定可用（androidx.room:room-testing）

# DataStore
datastore = "1.1.1"

# WorkManager
work = "2.10.0"

# Network
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinx-serialization = "1.7.3"
retrofit-kotlinx-serialization = "1.0.0"

# Coroutines
coroutines = "1.9.0"

# Logging
timber = "5.0.1"

# 测试
junit = "4.13.2"                       # Android 单元测试标准，AS 的 JUnit 模板依赖这个 jar
mockk = "1.13.13"
turbine = "1.2.0"
truth = "1.4.4"
androidx-test-ext = "1.2.1"
espresso = "3.6.1"
# 覆盖率（欠账 #6 已还）
jacoco = "0.8.12"                      # 0.8.11+ 兼容 AGP 8.7；0.8.12 修了 Android 15 边缘 case

# 下载引擎
# 阶段 2 兑底：换 JunkFood02 发布到 Maven Central 的 youtubedl-android。
# 坑 1——group 是 `youtubedl-android`（带 e 和 d），不是 `ytdlp-android`；artifact 是
#   `library`，不是 `core`。写错会被 Gradle 转去 JitPack 找，返 401。
# 坑 2——Gradle 坐标归 junkfood02，但 **Java 包名是 com.yausername.youtubedl_android.***
#   （带 _android 后缀）。不是 com.yausername.ytdlp.*——用后者会报 Unresolved reference。
# 两个坑的完整记录见 docs/phases/phase-2.md 的坑 2 / 坑 3。
junkfood02-youtubedl-android = "0.18.1"
ffmpeg-kit = "6.0-2"                   # mobile-ffmpeg-kit 的 fork（v0.1 暂不开）

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
# 阶段 9 v0.4.1：SplashScreen API
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
# 阶段 9 v0.4.1：SplashScreen API
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose BOM + 组件
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# 欠账 #3 已还：MigrationTestHelper 用于仪器测试写 v1→v2 这种迁移
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# DataStore
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Network
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# 下载引擎（v0.2 兑底：换 JunkFood02 fork）
ytdlp-android = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "junkfood02-youtubedl-android" }
# ffmpeg 暂不开（需要 30MB+ native libs，HLS / 音频提取 v0.2+ 再考虑）
ffmpeg-kit = { module = "com.arthenica:ffmpeg-kit-min", version.ref = "ffmpeg-kit" }

# 测试（只用 JUnit 4，不混 JUnit 5；Jupiter 跟 AS JUnit 模板冲突会出 "No junit.jar"）
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
