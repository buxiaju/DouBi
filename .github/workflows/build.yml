name: build-installer

# 自动发版 / 手动验证打包是否还能跑。
#
# 触发：
#   * 推送 ``v*`` 形式的 tag（如 ``v0.1.0``）→ 跑全套：测试 + 打包 +
#     上传 artifact + **创建 GitHub Release**。
#   * 手动 dispatch → 跑测试 + 打包 + 上传 artifact，**不**创建 release。
#     用来验证「现在的 main 分支能不能成功打包」。
#
# Runner：windows-latest。
#   NSIS 安装包用 ``tools/nsis/makensis.exe``，是 Windows 二进制；Python
#   wheel 也都是 windows-latest 自带的 PySide6 风格。**不要**换 linux
#   runner——packaging toolchain 不通用，会触发非 Windows 特定的 flakiness。
#
# 产物：
#   * ``DouBi-Setup-<version>.exe`` —— 主安装包（M6.8 加的）。
#   * ``DouBi-Setup-<version>.exe.sha256`` —— SHA256 校验文件，下载者
#     可对照核验。没配 GPG 签名（项目规模不需要），SHA256 是最划算的
#     「没篡改」证据。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # release 创建需要

jobs:
  build:
    name: tests + Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + dev dependencies
        # 不用 ``pip install -e .``：CI 不需要可编辑模式，反而会引入
        # 与本地开发不同的 import 路径。``pip install .`` 一次性装完
        # 生产依赖，再补 dev 依赖。
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest pytest-asyncio ruff

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        # 显式 ``shell: bash``：脚本里 ``${PIPESTATUS[0]}`` 和
        # ``if [ ... ]; then ... fi`` 是 bash 语法，Windows runner
        # 默认 pwsh 会把它当语法错——这一步白跑 50 秒还没报清楚。
        shell: bash
        # 跳过 GUI 类测试（无 PySide6 → 全部 skip），但**不**加
        # ``--ignore=tests/test_*_gui.py``——它们的 skip 行为本身
        # 是一条信息（环境里有没有 PySide6）。让 PySide6 缺失直接
        # skip 即可。
        # 在 CI 上用 ``--maxfail=5`` 提前结束：单测超过 5 个失败就
        # 是灾难，不要再花 25 分钟跑剩下的（本地仍有 26 文件 / 645
        # 用例；CI 跑 25~30 分钟是常态）。
        run: |
          python -m pytest -q --maxfail=5 2>&1 | tee pytest.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Tests failed (see pytest.log artifact)"
            exit 1
          fi

      - name: Upload pytest.log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Build Windows installer
        # ``build_installer.py`` 默认会先跑 ``build_exe.py``（PyInstaller
        # onedir），再调 makensis 打 NSIS。这是项目入口脚本——不要在这里
        # 重写一条 ``python -m PyInstaller ...`` 命令行，那样维护成本
        # 会复制一份。
        run: |
          python scripts/build_installer.py

      - name: Locate artifact
        id: locate
        # 产物名嵌入了版本号——版本号从 pyproject.toml 派生。
        # 用 ``Get-ChildItem`` 拿实际文件名，避免脚本把版本号硬编码
        # 进 workflow（版本号单一真源在 pyproject.toml）。
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'DouBi-Setup-*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            Write-Error "No DouBi-Setup-*.exe in dist/"
            exit 1
          }
          "exe=$($setup.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Located $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "dist/${{ steps.locate.outputs.exe }}" -Algorithm SHA256).Hash.ToLower()
          "${{ steps.locate.outputs.exe }}.sha256  $hash" | Out-File -Encoding ascii -NoNewline "dist/${{ steps.locate.outputs.exe }}.sha256"
          Get-Content "dist/${{ steps.locate.outputs.exe }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doubi-installer
          path: |
            dist/${{ steps.locate.outputs.exe }}
            dist/${{ steps.locate.outputs.exe }}.sha256
          # 90 天够用——下载者可以从 GitHub Release 拿到永久链接。
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 不在 changelog 里硬编码——用 git 自动生成的 release notes；
          # 仓库里有手写的 CHANGELOG.md，PR description 也够用。
          generate_release_notes: true
          files: |
            dist/${{ steps.locate.outputs.exe }}
            dist/${{ steps.locate.outputs.exe }}.sha256
          # draft: 发版前先看一遍；发版动作由人触发。
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}