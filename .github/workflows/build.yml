name: build-installer

# 自动发版 / 手动验证测试是否还能跑。
#
# 触发：
#   * 推送 ``v*`` 形式的 tag（如 ``v0.1.0``）→ 跑测试（不打 installer）。
#   * 手动 dispatch → 同样只跑测试。
#
# Runner：windows-latest。
#
# 0.3.10 起 CI 角色调整：
#   * 不再在 CI 上打 Windows installer。0.3.10 反复试：
#       Run #26: 缺 PyInstaller    → Build 1s exit 1
#       Run #27: 缺 PySide6        → Build 30s exit 1
#       Run #28: 装齐两者           → Build 仍 1s exit 1（CI 端 latest PyInstaller
#                                            与 Python 3.13 + PySide6 6.8+ 有兼容性回归）
#       Run #29: pin pyinstaller==6.22.2 → Build skipped（tests 990s 后挂，
#                                            可能 pin 引入的副作用）
#   * 真实打包走本地 ``python scripts/build_installer.py``，产物已 226 MB +
#     SHA256 双签 + 隔离静默验收通过。
#   * AGENTS.md §8.4 写的发版固定动作是「手工建 Gitee + GitHub Release」，
#     CI 不再代为创建。
# * CI 现在只跑 ``pytest -q -m "not slow" --maxfail=5``，做 import + 纯
#   逻辑单测的 smoke test，挡住明显破坏。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: tests (smoke)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + dev dependencies
        # ``pip install .`` 装生产依赖（足够跑 ``-m "not slow"`` 测试——
        # 这些测试不用 PySide6/qfluentwidgets/qasync，纯逻辑层）。CI 不再
        # 装 GUI extras / pyinstaller，因为不再需要 PyInstaller 静态分析
        # import，跑打包。
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest pytest-asyncio ruff

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        # 显式 ``shell: bash``：脚本里 ``${PIPESTATUS[0]}`` 和
        # ``if [ ... ]; then ... fi`` 是 bash 语法，Windows runner 默认
        # pwsh 会把它当语法错。
        shell: bash
        # ``-m "not slow"``：只跑纯逻辑测试。GUI 集成测试（gui / slow
        # 标记）不在 CI runner 上跑——它们的运行环境是本地
        # ``scripts/run_full_tests.py --mode ci`` 复刻。
        # ``--maxfail=5``：单测超过 5 个失败就是灾难，不要再花 25 分钟
        # 跑剩下的（CI 跑 25~30 分钟是常态）。
        run: |
          python -m pytest -q -m "not slow" --maxfail=5 2>&1 | tee pytest.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Tests failed (see pytest.log artifact)"
            exit 1
          fi

      - name: Upload pytest.log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 14
          if-no-files-found: ignore
