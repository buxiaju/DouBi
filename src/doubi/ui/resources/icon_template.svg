<?xml version="1.0" encoding="utf-8"?>
<!--
  豆比图标 · 渲染模板（QtSvg 安全子集）

  这份文件是 icon.svg（设计源文件）的「可渲染化」重写版，两点差异：

  1. **去掉 <filter> 与 <clipPath>**。Qt 的 SVG 模块只实现 SVG Tiny 1.2，
     对 feGaussianBlur / feColorMatrix 这类滤镜支持不完整——实测原始
     icon.svg 用 QSvgRenderer 渲染时，投影层的 feColorMatrix 被当成
     「实心黑圆角矩形」画在最上层，29% 的像素变成纯黑，图标整个糊掉。
     投影改由 rim-light 描边近似，视觉损失可忽略。
     原 clipPath 的裁剪框（252,232,620,620）完全包住两个腮红椭圆，
     本来就是 no-op，直接删掉。

  2. **viewBox 收紧到画面本体**。源文件画布 1124×1124，但圆角方块只占
     (50,30)-(1074,1054)，四周有约 4.5% 的死边——图标在标题栏/任务栏里
     看着偏小就是这段留白吃掉的。这里把 viewBox 设为 "50 30 1024 1024"，
     让圆角方块出血铺满整幅，同尺寸下视觉面积更大。

  颜色即占位符：下面 7 个品牌色值同时是 :func:`doubi.ui.resources.icon_svg`
  做主题换色时的替换锚点（见 BRAND_PALETTE）。因此本文件单独打开时就是
  一张正常的品牌色图标，改色只是纯文本替换，不引入模板语法。
  注意 #FFFFFF（眼睛高光、rim light）不参与替换，保持恒白。
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="50 30 1024 1024">
  <defs>
    <!-- 对角渐变：等价于源文件 gradientTransform 展开后的两个端点 -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse"
                    x1="-144.837" y1="144.837" x2="579.35" y2="869.024">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="1" stop-color="#FF5E7C"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect fill="url(#bg)" x="50" y="30" width="1024" height="1024" rx="232" ry="232"/>

  <!-- 呆毛：叶片 + 短茎 -->
  <path fill="#E8552A" transform="translate(527 259.26)"
        d="M0 27.7397C13.3333 -2.2603 30 -7.9269 50 10.7397C76.6667 -6.5936 97.6667 2.4064 113 37.7397C94.3333 53.0731 73.3333 57.4064 50 50.7397C30 57.4064 13.3333 49.7397 0 27.7397Z"/>
  <path fill="#E8552A" transform="translate(564 264)" fill-rule="evenodd"
        d="M13.6683 21.4051L3.6683 -1.5949Q3.0439 -3.1519 1.4661 -3.7216Q-0.0764 -4.3811 -1.5949 -3.6683Q-3.1519 -3.0439 -3.7216 -1.4661Q-4.3811 0.0764 -3.6683 1.5949L6.3317 24.5949Q6.9561 26.1519 8.5339 26.7216Q10.0764 27.3811 11.5949 26.6683Q13.1519 26.0439 13.7216 24.4661Q14.3811 22.9236 13.6683 21.4051Z"/>

  <!-- 脸 -->
  <ellipse fill="#FFE4D1" cx="562" cy="562" rx="248" ry="238"/>

  <!-- 左眼（弯月闭眼） -->
  <path fill="#2A2A2A" transform="translate(427 517)" fill-rule="evenodd"
        d="M45 -12Q18.8667 -12 -6.6564 5.0154Q-10.9224 7.6854 -11.767 12.6466Q-12.8955 17.5511 -9.9846 21.6564Q-7.3146 25.9224 -2.3534 26.767Q2.5511 27.8955 6.6564 24.9846Q26.1333 12 45 12Q63.8667 12 83.3436 24.9846Q87.4489 27.8955 92.3534 26.767Q97.3146 25.9224 99.9846 21.6564Q102.8955 17.5511 101.767 12.6466Q100.9224 7.6854 96.6564 5.0154Q71.1333 -12 45 -12Z"/>

  <!-- 右眼 + 两点高光 -->
  <circle fill="#2A2A2A" cx="640" cy="528" r="50"/>
  <circle fill="#FFFFFF" cx="658" cy="512" r="17"/>
  <circle fill="#FFFFFF" cx="620" cy="542" r="8"/>

  <!-- 腮红 -->
  <ellipse fill="#FF9AA2" opacity="0.6" cx="407" cy="610" rx="40" ry="27"/>
  <ellipse fill="#FF9AA2" opacity="0.6" cx="677" cy="610" rx="40" ry="27"/>

  <!-- 嘴 + 舌头 -->
  <path fill="#2A2A2A" transform="translate(437 592)"
        d="M0 0C83.3333 83.3333 166.6667 83.3333 250 0C166.6667 60 83.3333 60 0 0Z"/>
  <ellipse fill="#FF6B6B" cx="562" cy="660" rx="44" ry="28"/>

  <!-- rim light：近似源文件 filter_1 的内高光，让边缘在大尺寸下不发死 -->
  <rect fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        x="52" y="32" width="1020" height="1020" rx="230" ry="230"/>
</svg>
