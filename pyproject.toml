[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doubi"
# 版本号单一真源：字面量只存在于 src/doubi/__init__.py 的 __version__。
# setuptools 用 AST 静态读取该属性（不会 import 包，所以构建期不需要装依赖），
# 其余所有消费者（CLI -V / REST /health / MCP serverInfo / GUI APP_VERSION /
# NSIS PRODUCT_VERSION / CI 产物命名）一律派生，不再各抄一份。
dynamic = ["version"]
description = "DouBi - Multi-platform media downloader (Douyin / Bilibili / ...), backed by yt-dlp"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
authors = [
    { name = "DouBi contributors" },
]
keywords = ["douyin", "bilibili", "download", "yt-dlp", "pyside6", "cli", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "yt-dlp>=2024.4.9",
    "aiohttp>=3.9.0",
    "httpx>=0.25",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "aiosqlite>=0.19.0",
    "qrcode>=7.4",          # used by bilibili QR login in the CLI
    "gmssl>=3.2",           # sm3 for douyin a_bogus signing (M6.7, platforms/douyin/sign)
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets[full]>=1.6.0",
    "qrcode>=7.4",
    "psutil>=5.9",
    "qasync>=0.27.1",        # asyncio <-> Qt event-loop bridge
    "playwright>=1.40.0",   # browser-based auto-login (M3.1.1)
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
mcp = [
    # The stdio JSON-RPC bridge is stdlib-only; this extra is a placeholder
    # for future HTTP-transport support and Claude-Desktop metadata files.
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "httpx>=0.25",           # for testing the FastAPI server
]
all = [
    "doubi[gui,server,dev]",
]

[project.scripts]
doubi = "doubi.cli.main:main"
doubi-gui = "doubi.ui.app:main"
doubi-serve = "doubi.server.app:main"
doubi-mcp = "doubi.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doubi*"]

# 与 [project] dynamic = ["version"] 配对：attr: 是静态 AST 读取，
# 不 import doubi，因此 yt-dlp / PySide6 等运行期依赖不必在构建期存在。
[tool.setuptools.dynamic]
version = { attr = "doubi.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
# E402: 仓库所有 tests/ 文件都用 ``sys.path.insert(0, SRC)`` 在 import
# 前改 path（不 install 也能跑），这必然违反「import 在最上」。这条 ignore
# 属于测试环境的固有限制，不是规则漏洞。
ignore = ["E501", "E402"]
